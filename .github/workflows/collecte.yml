
name: Veille Bourse V5

on:
  workflow_dispatch:
  schedule:
    - cron: '15 20 * * 1-5'

permissions:
  contents: write

concurrency:
  group: veille-bourse
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Collecte V4
        run: python collecte.py

      - name: Screening V5
        run: python screening.py

      - name: Backtest exploratoire V6
        run: python backtest.py 
        
      - name: Portefeuille V6.1
        run: python portfolio_backtest.py
        
      - name: Publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation boursiere V5"
            git push
          fi
