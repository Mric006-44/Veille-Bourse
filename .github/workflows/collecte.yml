name: Veille Bourse V8.6
on:
  workflow_dispatch:
    inputs:
      run_backtests:
        description: "Exécuter les backtests historiques"
        type: boolean
        default: false
      refresh_financials:
        description: "Rafraichir les états financiers V8.6 (120 tickers)"
        type: boolean
        default: false
  schedule:
    - cron: '15 18 * * 1-5'
      timezone: 'Europe/Paris'
    - cron: '0 8 * * 6'
      timezone: 'Europe/Paris'
permissions:
  contents: write
concurrency:
  group: veille-bourse
  cancel-in-progress: false
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Tests V8 V8.3 cache V8.4 et V8.6
        run: |
          python -m unittest discover -s tests -p 'test_v8.py'
          python -m unittest discover -s tests -p 'test_v83.py'
          python -m unittest discover -s tests -p 'test_cache_v84.py'
          python -m unittest discover -s tests -p 'test_v86.py'
      - name: Collecte et audit incrementaux V8.4
        run: python collecte_v84.py pipeline
      - name: Rapport V7 historique
        run: python rapport_v7.py
      - name: Rapport enrichi V7.3
        run: python plans_v73.py
      - name: Fondamentaux V8 - semaine ou execution manuelle
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * 6'
        run: python fondamentaux_v8.py
      - name: Fondamentaux V8 - amorcage si absents
        if: github.event_name != 'workflow_dispatch' && github.event.schedule != '0 8 * * 6'
        run: |
          if [ ! -f data/fondamentaux_v8.json ]; then python fondamentaux_v8.py; fi
      - name: Rapport ChatGPT V8 historique
        run: python rapport_v8.py
      - name: Rapport ChatGPT V8.3 historique
        run: python rapport_v83.py
      - name: Comptes pluriannuels V8.6 (hebdo ou option manuelle)
        if: github.event.schedule == '0 8 * * 6' || (github.event_name == 'workflow_dispatch' && inputs.refresh_financials == true)
        run: python fondamentaux_v86.py
      - name: Amorcage comptes V8.6 si absents
        if: github.event.schedule != '0 8 * * 6' && !(github.event_name == 'workflow_dispatch' && inputs.refresh_financials == true)
        run: |
          if [ ! -f data/fondamentaux_v86.json ]; then python fondamentaux_v86.py; fi
      - name: Rapport V8.6 - V8.5 scoring et V8.6 fondamentaux
        run: python rapport_v86.py
      - name: Backtest V6 historique - manuel
        if: github.event_name == 'workflow_dispatch' && inputs.run_backtests == true
        run: python backtest.py
      - name: Portefeuille V6.1 - manuel
        if: github.event_name == 'workflow_dispatch' && inputs.run_backtests == true
        run: python portfolio_backtest.py
      - name: Robustesse V6.2 - manuel
        if: github.event_name == 'workflow_dispatch' && inputs.run_backtests == true
        run: python robustesse.py
      - name: Publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Veille V8.6 - scores prudents et comptes pluriannuels"
            git push
