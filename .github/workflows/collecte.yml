name: Veille Bourse V7.3

on:
  workflow_dispatch:
  schedule:
     - cron: '15 18 * * 1-5'
      timezone: 'Europe/Paris'

permissions:
  contents: write

concurrency:
  group: veille-bourse
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collecte V4
        run: python collecte.py
      - name: Screening V5
        run: python screening.py
      - name: Audit V6.3
        run: python fiabilisation.py
      - name: Rapport V7 historique
        run: python rapport_v7.py
      - name: Rapport enrichi V7.3
        run: python plans_v73.py
      - name: Backtest V6 (manuel)
        if: github.event_name == 'workflow_dispatch'
        run: python backtest.py
      - name: Portefeuille V6.1 (manuel)
        if: github.event_name == 'workflow_dispatch'
        run: python portfolio_backtest.py
      - name: Robustesse V6.2 (manuel)
        if: github.event_name == 'workflow_dispatch'
        run: python robustesse.py
      - name: Publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Rapport V7.3"
            git push
          fi
