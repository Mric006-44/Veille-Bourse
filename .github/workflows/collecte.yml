name: Veille Bourse V9.1
on:
  workflow_dispatch:
    inputs:
      run_backtests:
        description: "Executer les anciens backtests V6"
        type: boolean
        default: false
      run_v87:
        description: "Executer le backtest historique V8.7"
        type: boolean
        default: false
      run_v89:
        description: "Executer le backtest portefeuille V8.9"
        type: boolean
        default: false
      refresh_financials:
        description: "Rafraichir les comptes annuels V8.6"
        type: boolean
        default: false
  schedule:
    - cron: '15 18 * * 1-5'
      timezone: 'Europe/Paris'
    - cron: '0 8 * * 6'
      timezone: 'Europe/Paris'
permissions:
  contents: write
concurrency:
  group: veille-bourse
  cancel-in-progress: false
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Tests V8 a V9.1
        run: |
          python -m unittest discover -s tests -p 'test_v8.py'
          python -m unittest discover -s tests -p 'test_v83.py'
          python -m unittest discover -s tests -p 'test_cache_v84.py'
          python -m unittest discover -s tests -p 'test_v86.py'
          python -m unittest discover -s tests -p 'test_v88.py'
          python -m unittest discover -s tests -p 'test_v91.py'
      - name: Collecte incrementale et audit V8.4
        run: python collecte_v84.py pipeline
      - name: Rapports V7 et V7.3
        run: |
          python rapport_v7.py
          python plans_v73.py
      - name: Fondamentaux V8 - hebdomadaire ou manuel
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * 6'
        run: python fondamentaux_v8.py
      - name: Amorcage V8
        if: github.event_name != 'workflow_dispatch' && github.event.schedule != '0 8 * * 6'
        run: |
          if [ ! -f data/fondamentaux_v8.json ]; then python fondamentaux_v8.py; fi
      - name: Rapports historiques V8 V8.3
        run: |
          python rapport_v8.py
          python rapport_v83.py
      - name: Comptes pluriannuels V8.6
        if: github.event.schedule == '0 8 * * 6' || (github.event_name == 'workflow_dispatch' && inputs.refresh_financials == true)
        run: python fondamentaux_v86.py
      - name: Amorcage comptes pluriannuels V8.6
        if: github.event.schedule != '0 8 * * 6' && !(github.event_name == 'workflow_dispatch' && inputs.refresh_financials == true)
        run: |
          if [ ! -f data/fondamentaux_v86.json ]; then python fondamentaux_v86.py; fi
      - name: Rapport V8.6
        run: python rapport_v86.py
      - name: Plans V9.1 conservant R/R informatif
        run: python plans_v91.py
      - name: Catalyseurs V9.0 documentes
        run: python catalyseurs_v90.py
      - name: Rapport de synthese V9.1
        run: python rapport_v91.py
      - name: Backtest V8.7 - optionnel
        if: github.event_name == 'workflow_dispatch' && inputs.run_v87 == true
        run: python backtest_v87.py
      - name: Portefeuille historique V8.9 - optionnel
        if: github.event_name == 'workflow_dispatch' && inputs.run_v89 == true
        run: python backtest_v89.py
      - name: Backtests V6 - optionnels
        if: github.event_name == 'workflow_dispatch' && inputs.run_backtests == true
        run: |
          python backtest.py
          python portfolio_backtest.py
          python robustesse.py
      - name: Publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Veille V9.1 - portefeuille historique catalyseurs valorisation"
            git push
          fi
