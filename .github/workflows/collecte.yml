name: Veille Bourse quotidienne
on:
  workflow_dispatch:
  schedule:
    - cron: '15 20 * * 1-5'
permissions:
  contents: write
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python collecte.py
      - name: Enregistrer les resultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indicateurs.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation boursiere"
            git push
            fi
